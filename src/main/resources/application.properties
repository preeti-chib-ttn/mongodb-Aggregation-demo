spring.data.mongodb.uri=mongodb://localhost:27017/mongo_demo
server.port=8080

# Keep the pool deliberately small so concurrent long-running requests make
# connection-pool contention easy to observe in a demo.
spring.data.mongodb.options.max-connection-pool-size=5
spring.data.mongodb.options.min-connection-pool-size=1
spring.data.mongodb.options.max-wait-time=2s
